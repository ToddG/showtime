name = "showtime"
version = "0.3.0"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
licences = ["Apache-2.0"]
description = "A Gleam Testing Framework"
repository = { type = "github", user = "JohnBjrk", repo = "showtime" }
# links = [{ title = "Website", href = "https://gleam.run" }]
gleam = ">= 1.0.0"
target = "erlang"

[dependencies]
gleam_stdlib = ">= 0.62.0 and < 1.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_community_ansi = ">= 1.4.3 and < 2.0.0"
glint = ">= 1.2.1 and < 2.0.0"
gap = ">= 1.1.3 and < 2.0.0"
snap = ">= 0.12.2 and < 1.0.0"
simplifile = ">= 2.3.0 and < 3.0.0"
argv = ">= 1.0.2 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.6.1 and < 2.0.0"

[javascript.deno]
allow_read = ["./"]

